services:
  postgres:
    image: postgres:17-alpine
    container_name: uailibras-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: uailibras
      POSTGRES_USER: uailibras
      POSTGRES_PASSWORD: uailibras_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uailibras -d uailibras"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
